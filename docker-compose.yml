services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # Built locally from this repo by scripts/build-image.sh (the published autumn27/artex image is the
    # upstream Chinese build). Set ARTEX_IMAGE in .env to run a different image.
    image: ${ARTEX_IMAGE:-artex:local}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # JWT signing key lives on its own volume (not under data/, which the file manager can browse),
      # so it survives container recreation and sessions stay valid across updates.
      ARTEX_KEY_DIR: /app/keys
    ports:
      # Published on localhost only by default: the UI's first visitor sets the admin password and
      # 8788 is a recording proxy, so neither should face a network by accident. Set ARTEX_BIND=0.0.0.0
      # in .env only behind a firewall or a TLS reverse proxy.
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "${ARTEX_BIND:-127.0.0.1}:8788:8788"
    volumes:
      - ./keys:/app/keys
      # Bind the data directory (including jwt.key, SQLite, etc.) to data/ in the project root,
      # so it can be inspected/backed up directly on the host and survives container rebuilds.
      - ./data:/app/data
      # Mount the project root's skills into the container (overriding the image's built-in /app/skills);
      # changing a skill requires no image rebuild, since the container reads the host's copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
