# ARTEX Tencent TSec Benchmark evaluation image -- one-step local build + run.
# Independent of the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in foreground (view logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also delete the data volume)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the network with the physical host: the container uses the host network stack directly and can reach the host/VPN target networks.
    # In host mode no ports mapping is needed; the container binds host ports directly: 8787 (UI/API), 8788 (proxy),
    # and the internal PostgreSQL 5432 -- make sure these three host ports are free (stop any services using them before local testing).
    network_mode: host
    volumes:
      - artex_bench_data:/app/data   # persist jwt.key etc. (can be omitted for a throwaway sandbox)
    restart: "no"

volumes:
  artex_bench_data:
